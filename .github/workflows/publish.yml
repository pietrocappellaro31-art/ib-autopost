name: Publish scheduled Instagram posts

on:
  schedule:
    # GitHub does not guarantee cron timing, and it drops runs from
    # high-frequency schedules on quiet repositories: a */15 schedule here
    # fired once in seven hours. Runs are therefore concentrated into the
    # windows that actually contain post times, which is a schedule GitHub
    # is far more likely to honour, with an hourly sweep as a safety net.
    #
    # Times are UTC. 16:00-19:00 covers the 12:30 Eastern slot either side of
    # the daylight saving change; 02:00-04:00 covers a 22:00 Eastern slot.
    # posts.json times mean "publish at or after", so a late run still ships.
    - cron: "*/10 2-3,16-18 * * *"
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: selftest
        options:
          - selftest        # create one container, publish nothing
          - publish         # publish anything that is due

permissions:
  contents: write           # needed to write published ids back into posts.json

concurrency:
  group: instagram-publish  # never let two runs publish the same post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-test (creates a container, posts nothing)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'selftest'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python publish.py --selftest

      - name: Publish anything due
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'publish'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python publish.py

      - name: Record what was published
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'publish'
        run: |
          if [ -n "$(git status --porcelain posts.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posts.json
            git commit -m "Record published posts"
            git push
          else
            echo "No manifest changes."
          fi
