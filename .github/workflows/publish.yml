name: Publish scheduled Instagram posts

on:
  schedule:
    # GitHub does not guarantee cron timing, and it drops runs from
    # high-frequency schedules on quiet repositories: a */15 schedule here
    # fired once in seven hours. Runs are therefore concentrated into the
    # windows that actually contain post times, which is a schedule GitHub
    # is far more likely to honour, with an hourly sweep as a safety net.
    #
    # Times are UTC. 12:00-14:00 covers the 08:00 Eastern slot and 16:00-19:00
    # the 12:30 one, either side of the daylight saving change; 02:00-04:00
    # covers a 22:00 Eastern slot.
    # posts.json times mean "publish at or after", so a late run still ships.
    - cron: "*/10 2-3,12-13,16-18,22-23 * * *"
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: selftest
        options:
          - selftest        # create one container, publish nothing
          - publish         # publish anything that is due
          - reel-selftest   # upload a Reel from a reel/<slug> branch with the AI label, publish nothing
          - insights        # record how recent posts did (docs/daily/performance.*)
      reel_branch:
        description: "reel-selftest: the media branch, e.g. reel/selftest-newton-1720"
        required: false
        default: ""
      reel_file:
        description: "reel-selftest: the MP4 on that branch"
        required: false
        default: ""

permissions:
  contents: write           # needed to write published ids back into posts.json

concurrency:
  group: instagram-publish  # never let two runs publish the same post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-test (creates a container, posts nothing)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'selftest'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python publish.py --selftest

      - name: Reel self-test (uploads a Reel with the AI label, posts nothing)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'reel-selftest'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          REEL_BRANCH: ${{ inputs.reel_branch }}
          REEL_FILE: ${{ inputs.reel_file }}
        run: python publish.py --reel-selftest "$REEL_BRANCH" "$REEL_FILE"

      - name: Record performance
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'insights'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python publish.py --insights

      - name: Publish anything due
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'publish'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # deletes a Reel's temporary media branch once it is live
        run: python publish.py

      - name: Record what was published
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.mode == 'publish' || inputs.mode == 'insights')
        run: |
          files="posts.json docs/daily/performance.json docs/daily/performance.md"
          if [ -n "$(git status --porcelain $files)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $files
            git commit -m "Record published posts"
            # the daily Claude runs push to main too: rebase on them rather than fail
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          else
            echo "No manifest changes."
          fi
